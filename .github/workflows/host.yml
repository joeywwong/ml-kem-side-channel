name: Host-only correctness and simulation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python tasks.py test
      - run: python tasks.py host-mlkem
      - run: python tasks.py sanitize
      - run: python -c "import json; d=json.load(open('results/sanitizers.json')); assert all(v['status']=='PASS' for v in d.values()), d"
      - run: python tasks.py attack-sim
